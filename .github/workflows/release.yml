name: Publish versioned release

on:
  push:
    branches: [main]
    paths:
      - custom_components/repair_snooze/manifest.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate version and prepare release notes
        id: prepare
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          manifest = json.loads(Path("custom_components/repair_snooze/manifest.json").read_text())
          version = manifest["version"]
          if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", version):
              raise SystemExit(f"Expected stable SemVer MAJOR.MINOR.PATCH, got: {version}")
          changelog = Path("CHANGELOG.md").read_text()
          heading = rf"^## \[{re.escape(version)}\](?:\s.*)?$"
          match = re.search(heading, changelog, re.MULTILINE)
          if match is None:
              raise SystemExit(f"No changelog section for {version}")
          next_heading = re.search(r"^## \[", changelog[match.end():], re.MULTILINE)
          notes = changelog[match.end():][:next_heading.start() if next_heading else None].strip()
          if not notes:
              raise SystemExit(f"Empty release notes for {version}")
          (Path(os.environ["RUNNER_TEMP"]) / "release_notes.md").write_text(notes + "\n")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"version={version}\n")
          PY

      - name: Create tag and publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.prepare.outputs.version }}
        run: |
          tag="v${VERSION}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; nothing to publish."
            exit 0
          fi
          gh release create "$tag" \
            --target "$GITHUB_SHA" \
            --title "Repair Snooze $tag" \
            --notes-file "$RUNNER_TEMP/release_notes.md" \
            --latest
